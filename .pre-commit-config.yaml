repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        pass_filenames: false
        args: ["--config-file=pyproject.toml", "."]
        # 版本钉死：hook 环境重建时若装到 numpy>=2.5，其存根用了需 py3.12 的 PEP 695
        # 语法，按 python_version=3.11 检查会误报（如 ndarray.cumprod() 无参调用报错；
        # mypy 1.x 下更是直接中止）。
        additional_dependencies:
          - types-pytz==2026.2.0.20260518
          - pandas-stubs==3.0.3.260530
          - numpy==2.4.6
          - pytest==9.0.3
          - polars==1.41.2
          - quantstats==0.0.81
          - pydantic==2.13.4

  - repo: local
    hooks:
      - id: check-docs-links
        name: check docs links
        entry: uv run python scripts/check_docs_links.py
        language: system
        pass_filenames: false
      - id: check-docs-api-examples
        name: check docs api examples
        entry: uv run python scripts/check_docs_api_examples.py
        language: system
        pass_filenames: false
