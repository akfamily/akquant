[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "akquant"
version = "0.3.70"
description = "High-performance quantitative trading framework based on Rust and Python"
readme = "README.md"
license = {text = "MIT License"}
authors = [
    {name = "AKQuant Developers"},
    {email = "albertandking@gmail.com"}
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=2.2.2",
    "pyarrow>=14.0.0",
    "tqdm>=4.0.0",
    "plotly>=5.0.0",
    "polars>=0.20.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/akfamily/akquant"
Repository = "https://github.com/akfamily/akquant"
Documentation = "https://akquant.akfamily.xyz"

[project.optional-dependencies]
quantstats = [
    "quantstats>=0.0.60"
]
plot = [
    "plotly>=5.0.0",
]
ml = [
    "scikit-learn>=1.0.0",
    "torch>=2.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-static-i18n>=1.2.0",
    "akshare>=1.0.0",
]
signal-redis = [
    "redis>=5.0.0",
]
full = [
    "plotly>=5.0.0",
    "scikit-learn>=1.0.0",
    "torch>=2.0.0",
    "quantstats>=0.0.60",
]
dev = [
    "mypy==2.4.0",  # 与 .pre-commit-config.yaml 的 mirrors-mypy rev 保持一致
    "maturin>=1.11.5",
    "pandas-stubs>=2.3.3.260113",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "ruff==0.17.1",  # 与 .pre-commit-config.yaml 的 ruff-pre-commit rev 保持一致
    "types-pytz>=2025.2.0.20251108",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "akquant.akquant"
# vendored 前端资源(LWC standalone JS + LICENSE)随 wheel 一同分发,
# 保证 result.viz.review() 生成的 HTML 离线自包含。
include = [
    { path = "python/akquant/lwc/assets/*", format = ["sdist", "wheel"] },
]

[tool.ruff]
line-length = 88
target-version = "py310"
# ruff 0.17 起默认会格式化 Markdown 里的 Python 代码块；文档代码块（含故意省略的
# `...` 片段、对齐的行尾注释）不交给 ruff 改写。
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
# 按 3.11 检查:pandas-stubs 3.x 要求 >=3.11,目标设为 3.10 时 mypy 2.x 会把整个
# pandas 静默当作 Any(1.x 则部分失效),pandas 相关类型错误全部漏检。
# 3.10 运行时只能装 pandas 2,本就不在这套存根的覆盖范围内。
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = '(?x)(^|[\\/])vendor([\\/]|$)'
# import-untyped: pyarrow/akshare 等无 py.typed 存根的第三方库噪声(与本项目
#   类型安全无关; per-module override 对 .pyi 入口失效, 故全局禁用)。
# syntax: numpy 2.5.x 存根用 PEP 695 `type` 语句(需 py3.12), 与本项目
#   python_version 目标冲突, 其存根语法错误与本项目代码无关, 一并禁用。
#   (注意 syntax 错误是阻断性的, 此项禁用实际压不住; pre-commit 环境因此钉 numpy==2.4.6。)
disable_error_code = ["import-untyped", "syntax"]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "sklearn.*",
    "akshare.*",
    "pyarrow",
    "pyarrow.*",
    "polars",
    "polars.*",
    "pytest",
    "quantstats",
    "quantstats.*",
    # 可选依赖: redis 走 signal-redis extra 惰性导入; httpx 仅测试用
    "redis",
    "redis.*",
    "httpx",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
