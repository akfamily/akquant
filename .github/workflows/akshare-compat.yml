name: AKShare Compatibility

# 每天用最新版 AKShare 核对示例、脚本与文档里调用的接口名是否还存在。
# AKShare 会给接口改名并直接删除旧名；示例取数失败时回退到合成数据而不报错，
# 所以要单独盯接口名。只查名字是否存在，不联网取数。
on:
  schedule:
    - cron: "17 1 * * *" # 北京时间 09:17
  pull_request:
    paths:
      - "examples/**"
      - "scripts/**"
      - "docs/zh/**"
      - "docs/en/**"
      - "README.md"
      - "python/akquant/**/*.py"
      - ".github/workflows/akshare-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade akshare
      - name: Check AKShare interface names
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/check_akshare_interfaces.py
