name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# tag 构建并发布 wheel；push main 用同样的编译参数完整构建一遍但不上传，
# 只为把 sccache 写进 main 作用域——tag 运行读不到别的 tag 写的缓存，
# 只能读当前 ref 和默认分支的。两者编译参数必须一致，否则缓存键对不上。
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_LTO: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && 'thin' || 'false' }}
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && '1' || '16' }}

jobs:
  # 版本号自洽校验（pyproject.toml / Cargo.toml / Cargo.lock / CHANGELOG.md，tag 上再加 tag）。
  # 各构建 job 都依赖它：PyPI 版本号一经占用不可重用，发错要在花 10 分钟构建之前拦下。
  check-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify release metadata
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python scripts/check_release.py ${TAG:+"$TAG"}

  # PR 等其余事件只做 smoke check
  linux-smoke:
    runs-on: ubuntu-latest
    if: "!(startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-smoke-${{ hashFiles('**/Cargo.lock') }}
      - name: Smoke check
        run: cargo check --release --locked

  linux:
    runs-on: ubuntu-latest
    needs: check-release
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # 缓存 cargo registry 到宿主机，后面挂载进 Docker 容器
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-linux-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-linux-${{ matrix.target }}-
      - name: Prepare cargo dirs
        run: mkdir -p ~/.cargo/registry ~/.cargo/git
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: auto
          # 将宿主机的 cargo registry 挂载进容器
          docker-options: -v /home/runner/.cargo/registry:/root/.cargo/registry -v /home/runner/.cargo/git:/root/.cargo/git
      - name: Upload wheels
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  linux-musl:
    runs-on: ubuntu-latest
    needs: check-release
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-linux-musl-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-linux-musl-aarch64-
      - name: Prepare cargo dirs
        run: mkdir -p ~/.cargo/registry ~/.cargo/git
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64_unknown_linux_musl: -D__ARM_ARCH=8
        with:
          target: aarch64-unknown-linux-musl
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: musllinux_1_2
          docker-options: -v /home/runner/.cargo/registry:/root/.cargo/registry -v /home/runner/.cargo/git:/root/.cargo/git
      - name: Upload wheels
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-musllinux-aarch64
          path: dist

  windows:
    runs-on: windows-latest
    needs: check-release
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          python-version: '3.13'
          architecture: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Smoke check
        if: "!(startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')"
        run: cargo check --release --locked
      - name: Build wheels
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python
          sccache: 'true'
      - name: Upload wheels
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    needs: check-release
    strategy:
      matrix:
        target: [aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.target }}
      - name: Smoke check
        if: "!(startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')"
        run: cargo check --release --locked
      - name: Build wheels
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
      - name: Upload wheels
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    needs: check-release
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, linux-musl, windows, macos, sdist]
    # PyPI Trusted Publisher 绑定了该环境名；环境只允许 v* tag 部署
    environment:
      name: pypi
      url: https://pypi.org/p/akquant
    permissions:
      id-token: write  # 向 PyPI 换取临时上传令牌（OIDC）
      contents: write  # 创建 GitHub Release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      # check-release 校验的是仓库内的版本声明，这里校验真正要上传的产物文件名，
      # 并取出该版本的 CHANGELOG 段落作为 GitHub Release 正文
      - name: Verify built artifacts carry the tagged version
        run: python scripts/check_release.py "$GITHUB_REF_NAME" --dist dist --notes-out release-notes.md

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  # 发版 PR 用合并提交合入 main 后，把 dev 快进到 main，保持两条长期分支同源。
  # 只快进不强推：合入后 dev 又有新提交时跳过并告警，不会覆盖。
  # GITHUB_TOKEN 的推送不会再触发工作流，不会循环。
  sync-dev:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fast-forward dev to main
        run: |
          git fetch origin dev
          if git merge-base --is-ancestor origin/dev HEAD; then
            git push origin HEAD:refs/heads/dev
          else
            echo "::warning::dev 上有 main 之外的新提交，无法快进，请手动 git merge origin/main"
          fi
