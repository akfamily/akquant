name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# tag 构建并发布 wheel；push main 用同样的编译参数完整构建一遍但不上传，
# 只为把 sccache 写进 main 作用域——tag 运行读不到别的 tag 写的缓存，
# 只能读当前 ref 和默认分支的。两者编译参数必须一致，否则缓存键对不上。
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_LTO: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && 'thin' || 'false' }}
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && '1' || '16' }}

jobs:
  # 版本号自洽校验（pyproject.toml / Cargo.toml / Cargo.lock / CHANGELOG.md，tag 上再加 tag）。
  # 各构建 job 都依赖它：PyPI 版本号一经占用不可重用，发错要在花 10 分钟构建之前拦下。
  check-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify release metadata
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python scripts/check_release.py ${TAG:+"$TAG"}

  # PR 等其余事件只做 smoke check
  linux-smoke:
    runs-on: ubuntu-latest
    if: "!(startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-smoke-${{ hashFiles('**/Cargo.lock') }}
      - name: Smoke check
        run: cargo check --release --locked

  linux:
    runs-on: ubuntu-latest
    needs: check-release
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # 缓存 cargo registry 到宿主机，后面挂载进 Docker 容器
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-linux-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-linux-${{ matrix.target }}-
      - name: Prepare cargo dirs
        run: mkdir -p ~/.cargo/registry ~/.cargo/git
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: auto
          # 将宿主机的 cargo registry 挂载进容器
          docker-options: -v /home/runner/.cargo/registry:/root/.cargo/registry -v /home/runner/.cargo/git:/root/.cargo/git
      - name: Upload wheels
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  linux-musl:
    runs-on: ubuntu-latest
    needs: check-release
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-linux-musl-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-linux-musl-aarch64-
      - name: Prepare cargo dirs
        run: mkdir -p ~/.cargo/registry ~/.cargo/git
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64_unknown_linux_musl: -D__ARM_ARCH=8
        with:
          target: aarch64-unknown-linux-musl
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: musllinux_1_2
          docker-options: -v /home/runner/.cargo/registry:/root/.cargo/registry -v /home/runner/.cargo/git:/root/.cargo/git
      - name: Upload wheels
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-musllinux-aarch64
          path: dist

  windows:
    runs-on: windows-latest
    needs: check-release
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          python-version: '3.13'
          architecture: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Smoke check
        if: "!(startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')"
        run: cargo check --release --locked
      - name: Build wheels
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python
          sccache: 'true'
      - name: Upload wheels
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    needs: check-release
    strategy:
      matrix:
        target: [aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.target }}
      - name: Smoke check
        if: "!(startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')"
        run: cargo check --release --locked
      - name: Build wheels
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
      - name: Upload wheels
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    needs: check-release
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, linux-musl, windows, macos, sdist]
    # PyPI Trusted Publisher 绑定了该环境名；环境只允许 v* tag 部署
    environment:
      name: pypi
      url: https://pypi.org/p/akquant
    permissions:
      id-token: write  # 向 PyPI 换取临时上传令牌（OIDC）
      contents: write  # 创建 GitHub Release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      # check-release 校验的是仓库内的版本声明，这里校验真正要上传的产物文件名，
      # 并取出该版本的 CHANGELOG 段落作为 GitHub Release 正文
      - name: Verify built artifacts carry the tagged version
        run: python scripts/check_release.py "$GITHUB_REF_NAME" --dist dist --notes-out release-notes.md

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  # 登记到 MCP 官方注册表（registry.modelcontextprotocol.io），各 MCP 客户端的市场据此收录 AKQuant。
  # 单独成一个 job：登记失败不影响已完成的 PyPI 发布与 GitHub Release，修复后可单独重跑本 job。
  # 注册表会到 PyPI 读取本版本的项目说明，核对其中的 mcp-name 标记，因此必须在 PyPI 发布之后运行。
  # 流程与 akfamily/aktools 相同，见 https://modelcontextprotocol.io/registry/github-actions
  publish-mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: release
    permissions:
      # 通过 OIDC 证明本仓库属于 akfamily，从而获得 io.github.akfamily/* 命名空间，无需任何 secret
      id-token: write
      contents: read
    env:
      # 升级时同步修改；下载的二进制会用 cosign 校验签名
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      # PyPI 刚发布时，新版本的项目说明可能要过一会儿才能被读取，失败时等待后重试
      - name: Publish server to MCP Registry
        run: |
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish server.json; then
              exit 0
            fi
            echo "第 ${attempt} 次登记失败，60 秒后重试"
            sleep 60
          done
          exit 1

  # 发版 PR 用合并提交合入 main 后，把 dev 快进到 main，保持两条长期分支同源。
  # 只快进不强推：合入后 dev 又有新提交时跳过并告警，不会覆盖。
  # GITHUB_TOKEN 的推送不会再触发工作流，不会循环。
  sync-dev:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fast-forward dev to main
        run: |
          git fetch origin dev
          if git merge-base --is-ancestor origin/dev HEAD; then
            git push origin HEAD:refs/heads/dev
          else
            echo "::warning::dev 上有 main 之外的新提交，无法快进，请手动 git merge origin/main"
          fi
